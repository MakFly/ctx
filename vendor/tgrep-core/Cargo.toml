[package]
name = "ctx-tgrep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
memmap2 = "0.9"
memchr = "2"
regex = "1"
regex-syntax = "0.8"
rayon = "1"
ignore = "0.4"
globset = "0.4.18"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }
