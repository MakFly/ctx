[package]
name = "ctx-code"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Local codebase search, graph exploration, and MCP context packs for coding agents"
repository = "https://github.com/MakFly/ctx"
keywords = ["code-search", "coding-agents", "mcp", "tree-sitter", "sqlite"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".ctx/**",
    ".pytest_cache/**",
    ".venv/**",
    "**/__pycache__/**",
    "**/*.pyc",
    "target/**",
]

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
globset = "0.4"
ignore = "0.4"
rayon = "1.11"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.2", features = ["client", "transport-child-process", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }
toml_edit = "0.23"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
url = "2.5"
walkdir = "2.5"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.21"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
